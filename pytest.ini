[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    example: runs against the committed public model
    synthetic: runs against the generated IFC4 fixture (examples/make_synthetic_ifc4.py)
    open_model: needs the fetched open-access models (auto-skips when absent)
    private: needs the gitignored KAAN models (auto-skips when absent)
    slow: full run over a large model
